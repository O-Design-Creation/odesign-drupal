odesign_admin.dashboard:
  path: '/admin/boutique'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\DashboardController::page'
    _title: 'Ma boutique'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.config:
  path: '/admin/boutique/configuration'
  defaults:
    _form: '\Drupal\odesign_admin\Form\BoutiqueConfigForm'
    _title: 'Configuration de la boutique'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE
