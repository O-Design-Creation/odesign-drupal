odesign_admin.dashboard:
  path: '/admin/boutique'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\DashboardController::page'
    _title: 'Ma boutique'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.catalogue:
  path: '/admin/boutique/catalogue'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\CatalogueHubController::page'
    _title: 'Catalogue produits'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.editorial:
  path: '/admin/boutique/editorial'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\EditorialHubController::page'
    _title: 'Éditorial'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.config:
  path: '/admin/boutique/configuration'
  defaults:
    _form: '\Drupal\odesign_admin\Form\BoutiqueConfigForm'
    _title: 'Configuration de la boutique'
  requirements:
    _permission: 'administer odesign boutique'
  options:
    _admin_route: TRUE

odesign_admin.newsletter:
  path: '/admin/boutique/newsletter'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\NewsletterHubController::page'
    _title: 'Newsletter'
  requirements:
    _permission: 'administer odesign boutique'
  options:
    _admin_route: TRUE

odesign_admin.clients:
  path: '/admin/boutique/clients'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\ClientsController::page'
    _title: 'Clients'
  requirements:
    _permission: 'administer odesign boutique'
  options:
    _admin_route: TRUE

odesign_admin.analytics:
  path: '/admin/boutique/analytics'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\KpiCockpitController::page'
    _title: 'Cockpit KPI'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.analytics_export:
  path: '/admin/boutique/analytics/export'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\KpiCockpitController::exportMonthlyCsv'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.marketing_guide:
  path: '/admin/boutique/guide-marketing'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\DashboardController::marketingGuide'
    _title: 'Guide marketing boutique'
  requirements:
    _permission: 'administer odesign boutique'
  options:
    _admin_route: TRUE

odesign_admin.documentation:
  path: '/admin/boutique/documentation'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\DocumentationController::index'
    _title: 'Documentation gestionnaire'
  requirements:
    _permission: 'administer odesign boutique'
  options:
    _admin_route: TRUE

odesign_admin.documentation_chapter:
  path: '/admin/boutique/documentation/{chapter}'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\DocumentationController::chapter'
    _title: 'Documentation gestionnaire'
  requirements:
    _permission: 'administer odesign boutique'
    chapter: '^[0-9]{2}-[a-z0-9\-]+$'
  options:
    _admin_route: TRUE

odesign_admin.changelog:
  path: '/admin/boutique/changelog'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\ChangelogController::page'
    _title: 'Nouveautés & corrections'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_admin.documentation_screenshot:
  path: '/admin/boutique/documentation/screenshot/{filename}'
  defaults:
    _controller: '\Drupal\odesign_admin\Controller\DocumentationController::screenshot'
  requirements:
    _permission: 'administer odesign boutique'
    filename: '^[a-zA-Z0-9._-]+\.(png|jpg|jpeg|webp|gif)$'
  options:
    _admin_route: TRUE
