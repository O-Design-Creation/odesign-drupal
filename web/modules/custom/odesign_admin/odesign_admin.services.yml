services:
  odesign_admin.route_subscriber:
    class: Drupal\odesign_admin\EventSubscriber\RouteSubscriber
    tags:
      - { name: event_subscriber }

  odesign_admin.order_workflow_subscriber:
    class: Drupal\odesign_admin\EventSubscriber\OrderWorkflowSubscriber
    tags:
      - { name: event_subscriber }

  odesign_admin.lazy_builders:
    class: Drupal\odesign_admin\LazyBuilders\AdminLazyBuilders
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: drupal.lazy_builder }

  odesign_admin.pancarte_volume_discount_processor:
    class: Drupal\odesign_admin\OrderProcessor\PancarteVolumeDiscountProcessor
    tags:
      - { name: commerce_order.order_processor, priority: 10 }
