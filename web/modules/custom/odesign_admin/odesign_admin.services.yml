services:
  odesign_admin.order_workflow_helper:
    class: Drupal\odesign_admin\Order\OrderWorkflowHelper

  odesign_admin.route_subscriber:
    class: Drupal\odesign_admin\EventSubscriber\RouteSubscriber
    tags:
      - { name: event_subscriber }

  odesign_admin.lazy_builders:
    class: Drupal\odesign_admin\LazyBuilders\AdminLazyBuilders
    arguments:
      - '@entity_type.manager'
      - '@odesign_admin.order_workflow_helper'
    tags:
      - { name: drupal.lazy_builder }
