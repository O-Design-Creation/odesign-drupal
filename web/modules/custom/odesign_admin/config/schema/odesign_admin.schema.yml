    homepage_hero_enable_image:
      type: boolean
      label: 'Activer une image de fond sur le hero de la page d’accueil'
    homepage_hero_image:
      type: integer
      label: 'Fichier image du hero de la page d’accueil'
    homepage_hero_text_mode:
      type: string
      label: 'Mode de contraste du texte du hero de la page d’accueil'
    homepage_story_founder_title:
      type: string
      label: 'Titre du bloc Je me présente'
