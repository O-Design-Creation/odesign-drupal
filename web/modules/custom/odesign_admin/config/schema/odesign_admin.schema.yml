      type: text
      label: 'Texte du bloc Je me présente'
    homepage_story_founder_image:
      type: integer
      label: 'Image du bloc Je me présente'
    homepage_story_video_title:
      type: string
      label: 'Titre du bloc vidéo homepage'
    homepage_story_video_text:
      type: text
      label: 'Texte du bloc vidéo homepage'
    homepage_story_video_file:
      type: integer
