odesign_admin.settings:
  type: config_object
  label: 'Réglages O Design Admin'
  mapping:
    homepage_hero_enable_image:
      type: boolean
      label: 'Activer une image de fond sur le hero de la page d’accueil'
    homepage_hero_image:
      type: integer
      label: 'Fichier image du hero de la page d’accueil'
    homepage_hero_text_mode:
      type: string
      label: 'Mode de contraste du texte du hero de la page d’accueil'
    homepage_story_founder_title:
      type: string
      label: 'Titre du bloc Je me présente'
    homepage_story_founder_text:
      type: text
      label: 'Texte du bloc Je me présente'
    homepage_story_founder_image:
      type: integer
      label: 'Image du bloc Je me présente'
    homepage_story_video_title:
      type: string
      label: 'Titre du bloc vidéo homepage'
    homepage_story_video_text:
      type: text
      label: 'Texte du bloc vidéo homepage'
    homepage_story_video_file:
      type: integer
      label: 'Vidéo MP4 homepage'
    homepage_story_video_poster:
      type: integer
      label: 'Poster vidéo homepage'
    promotion_volume_rules:
      type: sequence
      label: 'Règles de remise volume'
      sequence:
        type: mapping
        mapping:
          enabled:
            type: boolean
            label: 'Règle active'
          label:
            type: string
            label: 'Libellé règle'
          scope:
            type: string
            label: 'Périmètre de ciblage'
          target_ids:
            type: sequence
            label: 'IDs cibles'
            sequence:
              type: integer
          tiers:
            type: sequence
            label: 'Paliers quantité/remise'
            sequence:
              type: mapping
              mapping:
                threshold:
                  type: integer
                  label: 'Quantité minimale'
                discount:
                  type: float
                  label: 'Remise unitaire'
          priority:
            type: integer
            label: 'Priorité'
          stop_further:
            type: boolean
            label: 'Stopper après application'
