odesign_orders.actionable_orders:
  path: '/admin/boutique/commandes-a-traiter'
  defaults:
    _controller: '\Drupal\odesign_orders\Controller\ActionableOrdersController::page'
    _title: 'Commandes à traiter'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_orders.order_detail:
  path: '/admin/boutique/commandes/{commerce_order}'
  defaults:
    _controller: '\Drupal\odesign_orders\Controller\OrderDetailController::page'
    _title: 'Détail de la commande'
  requirements:
    _permission: 'access commerce administration pages'
    _entity_access: 'commerce_order.view'
    commerce_order: \d+
  options:
    _admin_route: TRUE
  parameters:
    commerce_order:
      type: entity:commerce_order

odesign_orders.order_tracking:
  path: '/admin/boutique/commandes/{commerce_order}/tracking'
  defaults:
    _controller: '\Drupal\odesign_orders\Controller\OrderDetailController::saveTracking'
    _title: 'Enregistrer le suivi'
  requirements:
    _permission: 'access commerce administration pages'
    _entity_access: 'commerce_order.update'
    commerce_order: \d+
    _method: 'POST'
  options:
    _admin_route: TRUE
  parameters:
    commerce_order:
      type: entity:commerce_order

odesign_orders.order_transition:
  path: '/admin/boutique/commandes/{commerce_order}/transition/{transition}'
  defaults:
    _controller: '\Drupal\odesign_orders\Controller\OrderDetailController::applyTransition'
    _title: 'Appliquer une transition'
  requirements:
    _permission: 'access commerce administration pages'
    _entity_access: 'commerce_order.update'
    commerce_order: \d+
    transition: '[a-z_]+'
    _method: 'POST'
  options:
    _admin_route: TRUE
  parameters:
    commerce_order:
      type: entity:commerce_order

odesign_orders.customer_sav:
  path: '/user/{user}/orders/{commerce_order}/sav'
  defaults:
    _form: '\Drupal\odesign_orders\Form\CustomerSavRequestForm'
    _title: 'Demande SAV'
  requirements:
    _user_is_logged_in: 'TRUE'
    user: \d+
    commerce_order: \d+
  parameters:
    commerce_order:
      type: entity:commerce_order

odesign_orders.admin_sav_list:
  path: '/admin/boutique/sav'
  defaults:
    _controller: '\Drupal\odesign_orders\Controller\SupportRequestController::list'
    _title: 'Demandes SAV'
  requirements:
    _permission: 'access commerce administration pages'
  options:
    _admin_route: TRUE

odesign_orders.admin_sav_status:
  path: '/admin/boutique/sav/{request_id}/{status}'
  defaults:
    _controller: '\Drupal\odesign_orders\Controller\SupportRequestController::setStatus'
  requirements:
    _permission: 'access commerce administration pages'
    request_id: \d+
    status: 'new|in_progress|resolved'
  options:
    _admin_route: TRUE
