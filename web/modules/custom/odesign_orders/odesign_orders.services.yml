services:
  odesign_orders.route_subscriber:
    class: Drupal\odesign_orders\EventSubscriber\CheckoutRouteSubscriber
    tags:
      - { name: event_subscriber }

  odesign_orders.order_workflow_helper:
    class: Drupal\odesign_orders\Order\OrderWorkflowHelper

  odesign_orders.dashboard_order_stats_provider:
    class: Drupal\odesign_orders\Dashboard\OrderStatsProvider
    arguments:
      - '@database'
      - '@odesign_orders.order_workflow_helper'

  odesign_orders.lazy_builders:
    class: Drupal\odesign_orders\LazyBuilders\OrderToolbarLazyBuilders
    arguments:
      - '@entity_type.manager'
      - '@odesign_orders.order_workflow_helper'
    tags:
      - { name: drupal.lazy_builder }

  odesign_orders.order_workflow_subscriber:
    class: Drupal\odesign_orders\EventSubscriber\OrderWorkflowSubscriber
    arguments:
      - '@plugin.manager.mail'
      - '@language_manager'
      - '@config.factory'
      - '@entity_type.manager'
    tags:
      - { name: event_subscriber }

  odesign_orders.payment_confirm_subscriber:
    class: Drupal\odesign_orders\EventSubscriber\PaymentConfirmSubscriber
    arguments:
      - '@logger.factory'
    tags:
      - { name: event_subscriber }
