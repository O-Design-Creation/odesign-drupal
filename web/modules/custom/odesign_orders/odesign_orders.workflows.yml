odesign_order:
  id: odesign_order
  group: commerce_order
  label: 'Atelier O Design — Commandes'
  states:
    draft:
      label: 'Brouillon'
    pending_payment:
      label: 'En attente de paiement'
    processing:
      label: 'En fabrication (atelier laser)'
    quality_check:
      label: 'Contrôle qualité'
    packaged:
      label: 'Emballée / prête à expédier'
    shipped:
      label: 'Expédiée'
    completed:
      label: 'Livrée'
    canceled:
      label: 'Annulée'
    refunded:
      label: 'Remboursée'
  transitions:
    place:
      label: 'Confirmer la commande'
      from: [draft]
      to: pending_payment
    confirm_payment:
      label: 'Paiement reçu — mettre en fabrication'
      from: [pending_payment]
      to: processing
    quality_check:
      label: 'Passer au contrôle qualité'
      from: [processing]
      to: quality_check
    pack:
      label: 'Marquer comme emballée / prête à expédier'
      from: [quality_check]
      to: packaged
    ship:
      label: 'Marquer comme expédiée'
      from: [packaged]
      to: shipped
    deliver:
      label: 'Marquer comme livrée'
      from: [shipped]
      to: completed
    cancel:
      label: 'Annuler la commande'
      from: [draft, pending_payment, processing, quality_check, packaged]
      to: canceled
    refund:
      label: 'Rembourser'
      from: [completed, shipped, packaged, quality_check, processing, canceled]
      to: refunded
