langcode: fr
status: true
dependencies:
  config:
    - filter.format.full_html
  module:
    - ckeditor5
name: 'Full HTML'
format: full_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - '|'
      - bold
      - italic
      - underline
      - strikethrough
      - '|'
      - link
      - '|'
      - bulletedList
      - numberedList
      - '|'
      - blockQuote
      - uploadImage
      - insertTable
      - horizontalLine
      - '|'
      - sourceEditing
      - '|'
      - undo
      - redo
  plugins:
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_image:
      toolbar:
        - toggleImageCaption
        - imageTextAlternative
        - '|'
        - imageStyle:inline
        - imageStyle:wrapText
        - imageStyle:breakText
    ckeditor5_list:
      properties:
        reversed: false
        startIndex: false
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags: []
image_upload:
  status: true
  scheme: public
  directory: inline-images
  max_size: '10 MB'
  max_dimensions:
    width: 0
    height: 0
