# ──────────────────────────────────────────────────────────────────────────────
# Build & Push — image Docker vers GHCR
#
# Convention de tags (ADR-013) :
#   X.YrcN       (ex: 1.1rc1)    → build + push + déploiement AUTO preprod via Coolify
#   X.Y.ZrcN     (ex: 1.5.1rc1)  → build + push + déploiement AUTO preprod via Coolify
#   X.Y          (ex: 1.1)       → build + push ; déploiement prod MANUEL via workflow_dispatch
#   X.Y.Z        (ex: 1.5.1)     → build + push ; déploiement prod MANUEL via workflow_dispatch
#
# Secrets requis dans GitHub → Settings → Secrets :
#   COOLIFY_PREPROD_WEBHOOK  — webhook Coolify pour déclencher le déploiement preprod
#   COOLIFY_PROD_WEBHOOK     — webhook Coolify pour déclencher le déploiement prod
#   COOLIFY_API_TOKEN        — token API Coolify (Bearer)
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Push Docker image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+rc[0-9]+'       # ex: 1.1rc1    → preprod
      - '[0-9]+.[0-9]+.[0-9]+rc[0-9]+' # ex: 1.5.1rc1  → preprod
      - '[0-9]+.[0-9]+'               # ex: 1.1       → prod (déploiement manuel)
      - '[0-9]+.[0-9]+.[0-9]+'        # ex: 1.5.1     → prod (déploiement manuel)
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag stable à déployer en production (ex: 1.0.0)'
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & Push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      is_preprod: ${{ steps.tag_type.outputs.is_preprod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déterminer le type de tag
        id: tag_type
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?rc[0-9]+$ ]]; then
            echo "is_preprod=true"  >> "$GITHUB_OUTPUT"
            echo "env=preprod"      >> "$GITHUB_OUTPUT"
          else
            echo "is_preprod=false" >> "$GITHUB_OUTPUT"
            echo "env=prod"         >> "$GITHUB_OUTPUT"
          fi
          echo "Tag: $TAG → env: $(grep env= $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=preprod,enable=${{ steps.tag_type.outputs.is_preprod == 'true' }}
            type=raw,value=prod,enable=${{ steps.tag_type.outputs.is_preprod == 'false' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé build
        run: |
          echo "### Image construite ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag** : \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest** : \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Env cible** : ${{ steps.tag_type.outputs.env }}" >> $GITHUB_STEP_SUMMARY

  deploy-preprod:
    name: Déploiement préprod (auto)
    needs: build-push
    if: needs.build-push.outputs.is_preprod == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Aligner le tag Coolify sur le tag GitHub
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_PREPROD_WEBHOOK: ${{ secrets.COOLIFY_PREPROD_WEBHOOK }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook = os.environ["COOLIFY_PREPROD_WEBHOOK"]
          token = os.environ["COOLIFY_API_TOKEN"]
          tag = os.environ["GITHUB_REF_NAME"]

          parsed = urllib.parse.urlparse(webhook)
          query = urllib.parse.parse_qs(parsed.query)
          uuid = query.get("uuid", [None])[0]
          if not uuid:
            raise SystemExit("UUID Coolify introuvable dans COOLIFY_PREPROD_WEBHOOK")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", uuid):
            raise SystemExit("UUID Coolify invalide dans COOLIFY_PREPROD_WEBHOOK")

          api_root_match = re.match(r"^(.*?/api/v1)(?:/|$)", parsed.path)
          if not api_root_match:
            raise SystemExit("Impossible de retrouver /api/v1 depuis COOLIFY_PREPROD_WEBHOOK")

          base_url = urllib.parse.urlunparse(
              (parsed.scheme, parsed.netloc, api_root_match.group(1), "", "", "")
          )
          patch_url = f"{base_url}/applications/{uuid}"

          body = json.dumps({"docker_registry_image_tag": tag}).encode()
          request = urllib.request.Request(
              patch_url,
              data=body,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )

          try:
            with urllib.request.urlopen(request, timeout=30) as response:
              if not (200 <= response.status < 300):
                raise SystemExit(f"Echec PATCH Coolify: HTTP {response.status}")
          except urllib.error.HTTPError as error:
            details = error.read().decode("utf-8", errors="replace")
            raise SystemExit(f"Echec PATCH Coolify: HTTP {error.code} - {details}") from error
          except urllib.error.URLError as error:
            raise SystemExit(f"Echec PATCH Coolify: {error.reason}") from error

          print(f"Tag Coolify aligné sur {tag} pour l'application {uuid}")
          PY

      - name: Déclencher webhook Coolify (preprod)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -X GET "${{ secrets.COOLIFY_PREPROD_WEBHOOK }}")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Webhook Coolify a répondu HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Déploiement preprod déclenché (HTTP $HTTP_CODE)"

      - name: Résumé déploiement
        run: |
          echo "### Déploiement préprod déclenché ✅" >> $GITHUB_STEP_SUMMARY
          echo "URL : https://preprod.atelierodesign.fr" >> $GITHUB_STEP_SUMMARY
          echo "Image : \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY

  notify-prod-ready:
    name: Notification prod prête (tag stable)
    needs: build-push
    if: needs.build-push.outputs.is_preprod == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Résumé prod ready
        run: |
          echo "### Image de production prête ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Le déploiement en production reste MANUEL.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Déclencher ensuite ce workflow en \`workflow_dispatch\` avec le tag stable voulu." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image prête :" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "Digest : \`${{ needs.build-push.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY

  deploy-prod-manual:
    name: Déploiement prod (manuel)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Valider le tag stable demandé
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Le tag doit respecter le format stable X.Y ou X.Y.Z"
            exit 1
          fi

          git ls-remote --exit-code --tags "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RELEASE_TAG}" >/dev/null \
            || { echo "Tag Git introuvable: ${RELEASE_TAG}"; exit 1; }

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Vérifier la présence de l'image GHCR
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          docker manifest inspect "ghcr.io/${REPO_LOWER}:${RELEASE_TAG}" >/dev/null \
            || { echo "Image GHCR introuvable: ghcr.io/${REPO_LOWER}:${RELEASE_TAG}"; exit 1; }

      - name: Aligner le tag Coolify prod sur le tag GitHub
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_PROD_WEBHOOK: ${{ secrets.COOLIFY_PROD_WEBHOOK }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook = os.environ["COOLIFY_PROD_WEBHOOK"]
          token = os.environ["COOLIFY_API_TOKEN"]
          tag = os.environ["RELEASE_TAG"]

          parsed = urllib.parse.urlparse(webhook)
          query = urllib.parse.parse_qs(parsed.query)
          uuid = query.get("uuid", [None])[0]
          if not uuid:
            raise SystemExit("UUID Coolify introuvable dans COOLIFY_PROD_WEBHOOK")
          if not re.fullmatch(r"[A-Za-z0-9_-]+", uuid):
            raise SystemExit("UUID Coolify invalide dans COOLIFY_PROD_WEBHOOK")

          api_root_match = re.match(r"^(.*?/api/v1)(?:/|$)", parsed.path)
          if not api_root_match:
            raise SystemExit("Impossible de retrouver /api/v1 depuis COOLIFY_PROD_WEBHOOK")

          base_url = urllib.parse.urlunparse(
              (parsed.scheme, parsed.netloc, api_root_match.group(1), "", "", "")
          )
          patch_url = f"{base_url}/applications/{uuid}"

          body = json.dumps({"docker_registry_image_tag": tag}).encode()
          request = urllib.request.Request(
              patch_url,
              data=body,
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
          )

          try:
            with urllib.request.urlopen(request, timeout=30) as response:
              if not (200 <= response.status < 300):
                raise SystemExit(f"Echec PATCH Coolify prod: HTTP {response.status}")
          except urllib.error.HTTPError as error:
            details = error.read().decode("utf-8", errors="replace")
            raise SystemExit(f"Echec PATCH Coolify prod: HTTP {error.code} - {details}") from error
          except urllib.error.URLError as error:
            raise SystemExit(f"Echec PATCH Coolify prod: {error.reason}") from error

          print(f"Tag Coolify prod aligné sur {tag} pour l'application {uuid}")
          PY

      - name: Déclencher webhook Coolify (prod)
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -X GET "${{ secrets.COOLIFY_PROD_WEBHOOK }}")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Webhook Coolify prod a répondu HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Déploiement prod déclenché pour ${RELEASE_TAG} (HTTP $HTTP_CODE)"

      - name: Résumé déploiement prod
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          echo "### Déploiement prod déclenché ✅" >> $GITHUB_STEP_SUMMARY
          echo "URL : https://prod.atelierodesign.fr" >> $GITHUB_STEP_SUMMARY
          echo "Image : \`ghcr.io/${{ github.repository }}:${RELEASE_TAG}\`" >> $GITHUB_STEP_SUMMARY
