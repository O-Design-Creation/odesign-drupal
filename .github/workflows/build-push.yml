# ──────────────────────────────────────────────────────────────────────────────
# Build & Push — image Docker vers GHCR
#
# Convention de tags (ADR-013) :
#   X.YrcN  (ex: 2.4rc1)  → build + push + déploiement AUTO preprod via Coolify
#   X.Y.Z   (ex: 2.4.0)   → build + push ; déploiement prod MANUEL dans Coolify
#
# Secrets requis dans GitHub → Settings → Secrets :
#   COOLIFY_PREPROD_WEBHOOK  — webhook Coolify pour déclencher le déploiement preprod
#   COOLIFY_API_TOKEN        — token API Coolify (Bearer)
# ──────────────────────────────────────────────────────────────────────────────

name: Build & Push Docker image

on:
  push:
    tags:
      - '[0-9]+.[0-9]+rc[0-9]+'   # ex: 2.4rc1  → preprod
      - '[0-9]+.[0-9]+.[0-9]+'    # ex: 2.4.0   → prod (déploiement manuel)

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      is_preprod: ${{ steps.tag_type.outputs.is_preprod }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Déterminer le type de tag
        id: tag_type
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            echo "is_preprod=true"  >> "$GITHUB_OUTPUT"
            echo "env=preprod"      >> "$GITHUB_OUTPUT"
          else
            echo "is_preprod=false" >> "$GITHUB_OUTPUT"
            echo "env=prod"         >> "$GITHUB_OUTPUT"
          fi
          echo "Tag: $TAG → env: $(grep env= $GITHUB_OUTPUT | cut -d= -f2)"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=preprod,enable=${{ steps.tag_type.outputs.is_preprod == 'true' }}
            type=raw,value=prod,enable=${{ steps.tag_type.outputs.is_preprod == 'false' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé build
        run: |
          echo "### Image construite ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag** : \`${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest** : \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Env cible** : ${{ steps.tag_type.outputs.env }}" >> $GITHUB_STEP_SUMMARY

  deploy-preprod:
    name: Déploiement préprod (auto)
    needs: build-push
    if: needs.build-push.outputs.is_preprod == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Déclencher webhook Coolify (preprod)
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -X GET "${{ secrets.COOLIFY_PREPROD_WEBHOOK }}")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Webhook Coolify a répondu HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Déploiement preprod déclenché (HTTP $HTTP_CODE)"

      - name: Résumé déploiement
        run: |
          echo "### Déploiement préprod déclenché ✅" >> $GITHUB_STEP_SUMMARY
          echo "URL : https://preprod.atelierodesign.fr" >> $GITHUB_STEP_SUMMARY
          echo "Image : \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY

  notify-prod-ready:
    name: Notification prod prête (tag stable)
    needs: build-push
    if: needs.build-push.outputs.is_preprod == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Résumé prod ready
        run: |
          echo "### Image de production prête ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Le déploiement en production est MANUEL.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dans Coolify → projet \`drupal-prod\` → déployer l'image :" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}\`" >> $GITHUB_STEP_SUMMARY
          echo "Digest : \`${{ needs.build-push.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
