server {
    listen 80;
    server_name _;
    root /var/www/html/web;
    index index.php;

    client_max_body_size 64M;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # CSS/JS agrégés Drupal (CssCollectionOptimizerLazy) — passer à PHP si absent
    # Nécessaire car Drupal 11 génère le CSS à la volée via un controller, pas en fichier statique.
    location ~ ^/sites/default/files/(css|js)/ {
        try_files $uri @drupal;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Image styles Drupal — générer à la volée via PHP si l'image dérivée est absente
    location ~ ^/sites/default/files/styles/ {
        try_files $uri @drupal;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Fichiers statiques avec cache long (hors sites/default/files/ géré ci-dessus)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Named location : passe à PHP (index.php) avec le query string complet
    location @drupal {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Bloquer accès aux fichiers sensibles
    location ~ /\.(ht|git|env) {
        deny all;
    }

    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }
}
